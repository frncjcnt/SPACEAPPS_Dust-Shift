var EN=[{t:"The Lights Go Out",x:"Power failed first. The heaters clicked off, then the lights, then the hum of the base that everyone had stopped noticing. Mira called the evacuation by flashlight. Tomas carried Lia’s drawing in his chest pocket the whole walk to the lander. From orbit, they watched Halo go dark, one window at a time. ‘Dust took the sun from us,’ Aiko whispered. ‘Next time, we keep the panels clean.’ The next crew read her notes and did exactly that."},
{t:"Thin Air",x:"The oxygen alarms started softly, the way bad news usually does. Aiko moved everyone into the lander while Dev counted breaths out loud to keep them calm. They made it. Barely. On the ride home, Dev finally asked the question he’d been holding in: ‘Was it my fault?’ Mira squeezed his shoulder. ‘Dust gets in everything, kid. You were the one who noticed.’ Halo’s filters were redesigned the following year, and Dev’s name is on the plans."},
{t:"Seal Break",x:"It started with a whisper of escaping air and ended with the emergency hatch sealed behind them. The suits had been fighting the dust for two weeks, and the dust finally won a round. Everyone made it to the lander. Tomas laughed, shakily, and said, ‘My suit has more holes than my socks.’ Back on Earth, engineers studied the worn seals for months. Every crew after them wore better ones. That’s how progress works on the Moon: one bruised suit at a time."},
{t:"The Crew Comes First",x:"Nobody planned to stop. But somewhere between the dust and the long days, the crew ran out of strength. Mira made the hardest call of her career: abort. She wrote in the log, ‘We are not machines, and Halo was never supposed to need us to be.’ The relief ship brought them home to hugs, hot food, and a lot of sleep. Tomas called Lia from the hospital. She said, ‘You came back.’ He said, ‘I always will.’"},
{t:"Halo Rising",x:"The relief ship didn’t just rescue Halo. It stayed. Within a year the outpost grew from four people to twelve, and a greenhouse glowed at the edge of the crater. Lia stood on a stage in a school hall and told five hundred kids about her dad on the Moon. Dev’s old classroom hung his picture next to a poster of the lunar south pole. Mira kept the glove with fourteen dots in a glass case. The card beneath it read: ‘They kept the dust out and the hope in.’"},
{t:"Scars and Stars",x:"Halo survived, and so did the crew, though not without a few scars. Aiko slept for three days straight. Dev stopped talking in his sleep. Mira admitted, quietly, that she’d been terrified the whole time. The base was rebuilt stronger, and every wall held a note from this crew: ‘Be kind to each other. The dust will test you. So will the silence.’ The next team found those notes and cried a little. Then they got to work."},
{t:"The Dusty Walk Home",x:"They stepped off the relief ship covered in grey dust from head to boots, and nobody cared. Lia ran across the landing field and almost knocked Tomas over. Dev found his sister waiting with a cake that said ‘Welcome Back, Space Boy.’ Aiko got a standing ovation from the medical team. Mira stood alone for a moment and stared up at the Moon. ‘Same time next year?’ she whispered. The Moon, as always, said nothing."},
{t:"Barely Home",x:"It wasn’t pretty. The suits were torn, the habitat was a mess, and the crew looked like they’d been through a washing machine full of gravel. But everyone was alive, and Lia’s drawing was still taped above Tomas’s bunk, smudged and crumpled. He carried it out himself. ‘Worth every smudge,’ he said. Mission control logged it as ‘survived.’ The crew logged it as ‘the best worst two weeks of our lives.’"},
